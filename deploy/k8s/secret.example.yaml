# Copy to secret.yaml, fill in, apply it yourself. Not listed in
# kustomization.yaml: applying the example would write placeholders over a
# real secret. Every key is optional; without ADMIN_TOKEN the page is
# read-only and all notice writes are refused.
apiVersion: v1
kind: Secret
metadata:
  name: nabiz
  namespace: nabiz
  labels:
    app.kubernetes.io/name: nabiz
type: Opaque
stringData:
  ADMIN_TOKEN: "replace-me"
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
  ALERT_WEBHOOK_URL: ""
