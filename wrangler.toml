# Copy this next to your own deployment notes, fill in the two blanks, and
# `wrangler deploy`. Monitors are rows in D1 (see schema.sql), not config in
# a file — a monitor's URL is often somebody's hostname, and this repository
# is public.
name = "nabiz"
main = "src/worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* * * * *"]

# Workers Logs, inside the free tier — a cron that fails silently is a
# status page lying by omission.
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "nabiz"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[vars]
# "en", "tr", "de", "es" or "fr"
LANG = "en"
TITLE = "nabiz"

# Optional, as secrets (`wrangler secret put …`):
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID — a message on every state change
#   ALERT_WEBHOOK_URL                     — the same, as JSON to your own endpoint

# To serve on your own hostname, uncomment and let Cloudflare make the DNS.
# Worth doing for more than the address: the page's edge cache does nothing
# on a workers.dev deployment.
# routes = [{ pattern = "status.example.com", custom_domain = true }]

