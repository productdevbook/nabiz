# A tag is a release: the image that carries it is built from the same
# commit and pushed where the manifests and the compose file point.
name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            # Run by hand on a branch there is no version to name it
            # after, and a push with no tag at all is an error.
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
      # Built for this runner first and asked the two questions it
      # promises to answer: a tag can be put on any commit, and a release
      # nobody started is a release nobody checked.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nabiz:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: it answers on the port it says
        run: |
          docker run -d --name nabiz-smoke -p 8080:8080 nabiz:smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)
            [ "$code" = "204" ] && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)" = "204"
          docker logs nabiz-smoke
          docker rm -f nabiz-smoke

      - uses: docker/build-push-action@v6
        with:
          context: .
          # A homelab is as likely to be an arm board as a rented x86 box.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
