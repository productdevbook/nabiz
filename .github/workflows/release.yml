# A tag is a release: the image that carries it is built from the same
# commit and pushed where the manifests and the compose file point.
#
# This job holds the token that can publish, and what it publishes is what
# every self-hoster pulls — so the actions are pinned to commits rather
# than to tags somebody else can move. The version beside each is what the
# commit was when it was pinned; moving one is a deliberate edit.
name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Every tag, so the job can tell whether this one is the newest.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      # A tag can be put on any commit. Two things have to be true of this
      # one before an image goes out under its name: that the version it
      # will answer with is the version being released, and that the suite
      # passes — the smoke test below only asks whether it answers at all.
      - name: the tag, the package and the header agree
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          src=$(grep -oP 'VERSION = "\K[^"]+' src/lib/version.ts)
          echo "tag=$tag package.json=$pkg src=$src"
          test "$tag" = "$pkg"
          test "$tag" = "$src"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: newest
        if: github.ref_type == 'tag'
        run: |
          top=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "newest=$([ "$top" = "$GITHUB_REF_NAME" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "this=$GITHUB_REF_NAME newest=$top"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Only from a tag that is the newest release: a patch on an
            # older line — v3.9.1 after v3.10.0 — would otherwise move
            # `latest` and `3` backwards under everybody who pulls them,
            # which is what docs/UPGRADING.md tells a self-hoster to do.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.newest.outputs.newest == 'yes' }}
            # Run by hand on a branch there is no version to name it
            # after, and a push with no tag at all is an error.
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
      # Built for this runner first and asked the two questions it
      # promises to answer: a tag can be put on any commit, and a release
      # nobody started is a release nobody checked.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: nabiz:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: it answers on the port it says
        run: |
          docker run -d --name nabiz-smoke -p 8080:8080 nabiz:smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)
            [ "$code" = "204" ] && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)" = "204"
          # The build says which build it is, and it is this one: the gate
          # above reads the checkout, this reads what was actually built.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            said=$(curl -sI http://127.0.0.1:8080/health | tr -d '\r' | sed -n 's/^x-nabiz: //Ip')
            echo "x-nabiz=$said tag=${GITHUB_REF_NAME#v}"
            test "$said" = "${GITHUB_REF_NAME#v}"
          fi
          docker logs nabiz-smoke
          docker rm -f nabiz-smoke

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # A homelab is as likely to be an arm board as a rented x86 box.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
