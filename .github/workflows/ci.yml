name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to a release: the lockfile format tracks the bun version,
          # and a canary writes one no release can read.
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx oxlint --deny-warnings
      - run: bunx oxfmt --check src test
      - run: bun test
